server.port=4000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/board?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=developer
spring.datasource.password=

spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

secret-key=

file.path=
file.url=http://localhost:4000/file/

gemini.api.key=

auth.refresh-token.expiration-days=7
auth.refresh-token.cookie-name=refreshToken
auth.refresh-token.cookie-path=/api/v1/auth
auth.refresh-token.cookie-secure=false
auth.refresh-token.cookie-same-site=Lax

# 민감 정보는 application-secret.properties 에서 로드
spring.config.import=optional:classpath:application-secret.properties
